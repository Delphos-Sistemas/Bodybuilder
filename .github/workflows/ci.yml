name: CI

on:
  pull_request:
  push:
    branches: [main, nova-versao]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Testes de navegação (Chrome e Safari/WebKit)
        run: npx playwright test --trace off
        env:
          PW_WEBKIT: "1"
